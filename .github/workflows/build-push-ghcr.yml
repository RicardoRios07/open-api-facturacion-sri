name: Build and Push GHCR (chamba-staging)

on:
  push:
    branches: [deploy/chamba-staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ricardorios07/open-api-facturacion-sri:chamba-staging
            ghcr.io/ricardorios07/open-api-facturacion-sri:chamba-staging-${{ github.sha }}
