# =================================================
# Docker Compose - Open API Facturación SRI (Development)
# =================================================
# Usage: docker compose up -d --build
#
# This file reads from .env.docker for configuration.
# Copy .env.docker.example to .env.docker and customize.

services:
  # ─── PostgreSQL local (aislado; nunca apunta a staging/producción) ───
  postgres:
    image: postgres:17-alpine
    container_name: vendi-local-sri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_sri_local}
      POSTGRES_USER: ${POSTGRES_USER:-sri_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/local-bootstrap.sql:/docker-entrypoint-initdb.d/000-bootstrap.sql:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Carbone.io (Generación de PDFs) ───
  carbone:
    image: carbone/carbone-ee:latest
    container_name: vendi-local-sri-carbone
    restart: unless-stopped
    environment:
      - CARBONE_EE_STUDIO=true
    ports:
      - '${CARBONE_PORT:-4000}:4000'
    volumes:
      - ${HOST_TEMPLATES_PATH:-../templates}:/app/template
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/4000"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'
  # ─── Redis (BullMQ + Cache) ───
  redis:
    image: redis:7-alpine
    container_name: vendi-local-sri-redis
    restart: unless-stopped
    command: >
      /bin/sh -c '
      if [ -n "${REDIS_PASSWORD:-}" ]; then
        exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
      else
        exec redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
      fi
      '
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # ─── Open API Facturación SRI ───
  open-api-facturacion-sri:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendi-local-sri-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # BUG-06/11: Conectar a Redis dentro del compose network
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

    # Port mapping
    ports:
      - '${LOCAL_API_PORT:-3002}:${PORT:-3002}'

    # Volume mounts for persistent data
    volumes:
      - ${HOST_TEMPLATES_PATH:-./templates}:/data/templates
      - ${HOST_PDFS_PATH:-./pdfs}:/data/pdfs
      - ${HOST_CERTS_PATH:-./certs}:/data/certs
      - ${HOST_XMLS_PATH:-./xmls}:/data/xmls
      - ./database:/app/database:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Health check
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${PORT:-3002}/status',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Logging
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
